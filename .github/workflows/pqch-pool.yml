# pqch-pool CI: build and run the tests on Linux. Actions pinned by SHA (same versions as pqch-core/pqch).
name: pqch-pool CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pqch-pool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Submodules (no gRPC; BoringSSL only, for TLS)
        run: |
          git submodule update --init --depth 1 external/src/RandomX external/src/cppzmq external/src/libuv \
            external/src/libzmq external/src/rapidjson external/src/robin-hood-hashing external/src/curl \
            external/src/miniupnp tests/googletest
          git submodule update --init --depth 1 external/src/grpc
          git -C external/src/grpc submodule update --init --depth 1 third_party/boringssl-with-bazel
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libuv1-dev libzmq3-dev libcurl4-openssl-dev nasm
      - name: Build
        run: |
          cmake -B build -DWITH_GRPC=OFF -DWITH_MERGE_MINING_DONATION=OFF -DWITH_UPNP=OFF -DWITH_LTO=OFF
          cmake --build build -j"$(nproc)"
      - name: Tests
        run: |
          cd tests
          cmake -B build -DWITH_GRPC=OFF -DWITH_UPNP=OFF -DWITH_LTO=OFF
          cmake --build build -j"$(nproc)"
          cd build
          # pool_block.verify needs Monero share data that is not in the repository; it is replaced in phase A.
          ./p2pool_tests --gtest_filter='-pool_block.verify'

  regtest:
    # Phase A acceptance: the pool against a real pqchd (built from pqch-core/pqch main) on regtest.
    name: Pool against pqchd (regtest)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pqch-core/pqch
          ref: main
          path: pqch
          persist-credentials: false
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkgconf python3 libevent-dev \
            libboost-dev libsqlite3-dev ccache libuv1-dev libzmq3-dev libcurl4-openssl-dev nasm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-pqchd-${{ hashFiles('pqch/src/**') }}
          restore-keys: ccache-pqchd-
      - name: Build pqchd and pqch-cli
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
        run: |
          cmake -S pqch -B pqch/build -DENABLE_WALLET=ON -DENABLE_IPC=OFF -DBUILD_GUI=OFF -DBUILD_TESTS=OFF \
            -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DWITH_CCACHE=ON
          cmake --build pqch/build -j"$(nproc)" --target bitcoind bitcoin-cli
      - name: Build the pool
        run: |
          git submodule update --init --depth 1 external/src/RandomX external/src/cppzmq external/src/libuv \
            external/src/libzmq external/src/rapidjson external/src/robin-hood-hashing external/src/curl \
            external/src/miniupnp
          git submodule update --init --depth 1 external/src/grpc
          git -C external/src/grpc submodule update --init --depth 1 third_party/boringssl-with-bazel
          cmake -B build -DWITH_GRPC=OFF -DWITH_MERGE_MINING_DONATION=OFF -DWITH_UPNP=OFF -DWITH_LTO=OFF
          cmake --build build -j"$(nproc)"
      - name: Blocks built by the pool are accepted by pqchd
        run: tests/pqch/regtest_mine.sh pqch/build/bin build/p2pool
      - name: One pool node finds blocks that pay the share chain (phase A criterion)
        run: tests/pqch/regtest_pool.sh pqch/build/bin build/p2pool 90
      - name: Two pool nodes form one pool; a late node syncs (phase B, regtest)
        run: tests/pqch/regtest_two_pools.sh pqch/build/bin build/p2pool 120
      - name: Stratum miner without a node (phase C)
        run: tests/pqch/regtest_stratum.sh pqch/build/bin build/p2pool 90
